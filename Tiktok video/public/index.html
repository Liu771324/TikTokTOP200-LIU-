<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>短视频榜采集台</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="shell">
      <div class="eyebrow">抖音电商罗盘 / 本地采集</div>
      <h1>短视频榜采集台</h1>
      <p>筛选前 200 名商品，保存每件商品前四条可播放的带货视频与文案。</p>
    </div>
  </header>
  <main class="shell workspace">
      <section class="card connection">
        <div class="card-title"><span class="step">01</span><h2>连接罗盘</h2></div>
        <div class="row"><button id="checkEdge" class="button secondary">打开短视频榜</button><button id="loadOptions" class="button">读取页面选项</button></div>
        <p id="edgeStatus" class="notice">正在打开商机中心并进入短视频榜；如需登录，请在 Edge 中完成。</p>
      </section>
    <div class="layout">
      <section class="card settings">
        <div class="card-title"><span class="step">02</span><h2>设置采集条件</h2></div>
        <label for="categorySearch" class="field-label">行业类目 · 单选</label>
        <input id="categorySearch" type="search" placeholder="搜索类目" disabled>
        <select id="category" size="7" disabled aria-label="行业类目"></select>
        <div class="field-label">品牌类型 · 单选</div><div id="brands" class="choices"></div>
        <div class="field-label">榜单周期 · 单选</div><div id="periods" class="choices"></div>
        <div class="field-label">采集条件 · 单选</div>
        <div class="choices">
          <label><input type="radio" name="trend" value="first" checked>仅首次上榜</label>
          <label><input type="radio" name="trend" value="up_and_first">排名上升及首次上榜</label>
        </div>
        <button id="startTask" class="button wide" disabled>创建并开始任务</button>
      </section>
      <div class="activity">
      <section class="card">
        <div class="card-title"><span class="step">03</span><h2>任务进度</h2></div>
        <p id="taskStatus" class="notice">当前没有任务。</p>
        <div class="metrics">
          <div><span>已扫描</span><strong id="scanned">0</strong><small>/ 200</small></div>
          <div><span>符合条件</span><strong id="eligible">0</strong></div>
          <div><span>视频成功</span><strong id="saved">0</strong></div>
          <div><span>视频失败</span><strong id="failed">0</strong></div>
          <div><span>文案缺失</span><strong id="captionFailed">0</strong></div>
        </div>
        <div class="row"><button id="pauseTask" class="button secondary" disabled>暂停</button><button id="resumeTask" class="button secondary" disabled>续跑</button><button id="stopTask" class="button danger" disabled>停止</button></div>
        <div id="logs" class="logs" aria-live="polite">任务日志会显示在这里。</div>
      </section>
      <section class="card">
        <div class="card-title"><span class="step">04</span><h2>历史任务</h2></div>
        <div id="taskList" class="task-list muted">暂无任务。</div>
      </section>
      </div>
    </div>
  </main>
  <footer class="shell footer">所有视频与文案保存在当前项目的“视频”目录。请仅保存有权使用的内容。</footer>
</body>
</html>
